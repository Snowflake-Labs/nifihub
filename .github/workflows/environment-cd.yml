name: Environment CD

on:
  push:
    branches: [main]
    paths: ['environments/**', 'scripts/cd/**', 'scripts/run-cd.py']
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Environment directory to reconcile; leave empty for all environments'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nifi-environment-cd
  queue: max
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.items }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Select environments
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_ENVIRONMENT: ${{ inputs.environment_name }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/cd/detect_environments.py "$GITHUB_OUTPUT"

  apply:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.detect.outputs.environments) }}
    environment: ${{ matrix.item.github_env }}
    env:
      NIFI_TOKEN: ${{ secrets.NIFI_TOKEN }}
      NIFI_USERNAME: ${{ vars.NIFI_USERNAME }}
      NIFI_PASSWORD: ${{ secrets.NIFI_PASSWORD }}
      NIFI_VERIFY_SSL: ${{ vars.NIFI_VERIFY_SSL || 'true' }}
      GH_SECRETS_JSON: ${{ toJSON(secrets) }}
      GH_VARS_JSON: ${{ toJSON(vars) }}
      CONFIG_ENV: ${{ matrix.item.config_env }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/cd/requirements-cd.txt
      - name: Reconcile NiFi resources
        run: python scripts/run-cd.py "environments/$CONFIG_ENV/config.yaml"
