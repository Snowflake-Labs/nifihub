name: Environment CD Validate

on:
  pull_request:
    paths: ['environments/**', 'scripts/cd/**', 'scripts/run-cd.py']

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.items }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Select environments
        id: detect
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/cd/detect_environments.py "$GITHUB_OUTPUT"

  validate:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.detect.outputs.environments) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/cd/requirements-cd.txt
      - name: Validate configuration
        env:
          CONFIG_ENV: ${{ matrix.item.config_env }}
        run: python scripts/cd/validate_pr.py "environments/$CONFIG_ENV/config.yaml" environments/schema.json

  plan:
    needs: [detect, validate]
    if: needs.detect.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.detect.outputs.environments) }}
    environment: ${{ matrix.item.github_env }}
    env:
      NIFI_TOKEN: ${{ secrets.NIFI_TOKEN }}
      NIFI_USERNAME: ${{ vars.NIFI_USERNAME }}
      NIFI_PASSWORD: ${{ secrets.NIFI_PASSWORD }}
      NIFI_VERIFY_SSL: ${{ vars.NIFI_VERIFY_SSL || 'true' }}
      GH_SECRETS_JSON: ${{ toJSON(secrets) }}
      GH_VARS_JSON: ${{ toJSON(vars) }}
      CONFIG_ENV: ${{ matrix.item.config_env }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/cd/requirements-cd.txt
      - name: Read NiFi state and compute plan
        run: |
          python scripts/cd/describe_live_state.py "environments/$CONFIG_ENV/config.yaml" > "$RUNNER_TEMP/live-state.json"
          python scripts/cd/diff_live.py "$RUNNER_TEMP/live-state.json" "environments/$CONFIG_ENV/config.yaml" > "$RUNNER_TEMP/live-diff.json"
          python scripts/cd/format_change_plan.py "$RUNNER_TEMP/live-diff.json" > "$RUNNER_TEMP/change-plan.md"
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- env-cd-validate:${process.env.CONFIG_ENV} -->`;
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/change-plan.md`, 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
